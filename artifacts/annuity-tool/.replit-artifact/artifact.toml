kind = "web"
previewPath = "/"
title = "Do I Need An Annuity?"
version = "1.0.0"
id = "artifacts/annuity-tool"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19907

[services.development]
run = "pnpm --filter @workspace/annuity-tool run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/annuity-tool", "run", "build" ]
serve = "static"
publicDir = "artifacts/annuity-tool/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19907"
BASE_PATH = "/"
